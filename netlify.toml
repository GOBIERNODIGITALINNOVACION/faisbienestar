# FAIS Bienestar (faisbienestar.com). Sitio estatico: las paginas las genera
# Lokus Data Platform/scripts/generar_faisbienestar.py desde la capa Oro; aqui no hay build.

[build]
  publish = "."
  command = ""

# Seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Estilos, script e icono: un dia (las paginas los piden con ?v=VERSION_ESTATICOS del generador)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icono.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Paginas del sitio viejo (Power BI y generador de informes) -> portada
[[redirects]]
  from = "/faisporestado.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/INDICADORESANALISIS.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/indicadoresanalisis.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/analisis-fais.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/gracias.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pagina-principal"
  to = "/"
  status = 301
  force = true

# Pagina del sitio de Google Sites (2024) que Google todavia tiene registrada
[[redirects]]
  from = "/página-principal"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/p%C3%A1gina-principal"
  to = "/"
  status = 301
  force = true

# Lo que no existe cae en /404.html (Netlify lo sirve solo, con estado 404)
